[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runops"
version = "1.1.0"
description = "HPC simulation run management CLI tool for Slurm-based environments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "packaging>=24.0",
    "typer>=0.9",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "tomlkit>=0.13",
    "rich>=13.0",
    "jinja2>=3.1",
    "mcp>=1.27.1",
]

[project.scripts]
runo = "runops.cli.main:app"
runops = "runops.cli.main:runops_app"

[tool.hatch.build.targets.wheel]
packages = ["src/runops"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "runops/_data/README.md"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "tomli>=2.4.1",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
    "src/runops/templates/scaffold/vscode_settings.json",
    # Bundled skill helper scripts are copied into generated projects and are
    # validated by their skill-level smoke tests, not runops's lint profile.
    "src/runops/templates/skills/*/scripts/*.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    "TC",
    "RUF",
]
ignore = [
    "B008",   # typer uses function calls in argument defaults by design
    "TC001",  # moving first-party imports into TYPE_CHECKING breaks runtime
    "TC003",  # moving stdlib imports into TYPE_CHECKING blocks is not needed here
    "UP045",  # Optional[X] required for typer compatibility with Python 3.10
]

[tool.ruff.lint.isort]
known-first-party = ["runops"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
# Scaffolded scripts under templates/ are reference implementations copied into
# user projects.  They may target the generated project environment rather than
# runops's strict internal mypy profile.
exclude = [
    "^src/runops/templates/adapters/.*/summarize\\.py$",
    "^src/runops/templates/skills/.*/scripts/.*\\.py$",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.runops.coverage-policy.modules]
"src/runops/core/manifest.py" = 95
"src/runops/application/execution/submission/apply.py" = 90
"src/runops/application/execution/submission/claim.py" = 90
"src/runops/application/execution/submission/planning.py" = 90
"src/runops/core/state.py" = 90
"src/runops/core/event_log.py" = 80
"src/runops/slurm/submit.py" = 90
"src/runops/adapters/contrib/beach/adapter.py" = 80
"src/runops/adapters/contrib/beach/diagnostics.py" = 80
"src/runops/application/analysis/story/models.py" = 95
"src/runops/application/analysis/story/schema.py" = 90
"src/runops/application/analysis/story/audit.py" = 95
"src/runops/application/analysis/story/sources.py" = 80
"src/runops/application/analysis/story/render.py" = 90
"src/runops/application/analysis/story/workspace.py" = 80
