[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runops"
version = "2.1.2"
description = "Run ledger and Slurm job submission for HPC simulation projects"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["hpc", "slurm", "simulation", "ai-agent", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "packaging>=24.0",
    "typer>=0.9",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "tomlkit>=0.13",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/Nkzono99/runops"
Documentation = "https://github.com/Nkzono99/runops/blob/main/docs/reference.md"
Issues = "https://github.com/Nkzono99/runops/issues"

[project.scripts]
runo = "runops.cli:main"
runops = "runops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runops"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "tomli>=2.4.1",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    "TC",
    "RUF",
]
ignore = [
    "B008",   # typer uses function calls in argument defaults by design
    "TC001",  # moving first-party imports into TYPE_CHECKING breaks runtime
    "TC003",  # moving stdlib imports into TYPE_CHECKING blocks is not needed here
    "UP045",  # Optional[X] required for typer compatibility with Python 3.10
]

[tool.ruff.lint.per-file-ignores]
"src/runops/harness.py" = ["E501"]
"tests/*" = ["E501", "N818", "TC002"]

[tool.ruff.lint.isort]
known-first-party = ["runops"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Exercised from copies inside test projects (project-local adapters).
omit = ["src/runops/legacy_adapters/*"]
