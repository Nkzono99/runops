# Codex CLI project-local config for the runops development repository.
#
# Codex auto-loads this file when the project is marked trusted in
# ~/.codex/config.toml:
#
#   [projects."<absolute path to this repository>"]
#   trust_level = "trusted"
#
# See .codex/README.md for the full wiring guide.

# Local automations for this repository intentionally run unattended maintenance
# such as `git pull`, issue triage, web lookup, fixes, tests, commits, and push.
# Use full access by default so those runs do not get stuck behind the
# workspace-write sandbox or blocked network access.
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "live"

# Keep AGENTS.md compact; detailed guidance belongs in .codex/rules/ and
# .agents/skills/. This budget intentionally stays near the default 32 KiB.
project_doc_max_bytes = 32768

[tools]
web_search = { context_size = "medium" }
