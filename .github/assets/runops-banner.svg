<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-label="runops: simulation runs, driven by your AI agent">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- icon: a stack of run directories, the front one running -->
  <g transform="translate(56 42)">
    <rect x="34" y="0" width="112" height="84" rx="16" fill="none" stroke="url(#brand)" stroke-width="5" opacity="0.35"/>
    <rect x="17" y="20" width="112" height="84" rx="16" fill="none" stroke="url(#brand)" stroke-width="5" opacity="0.65"/>
    <rect x="0" y="40" width="112" height="84" rx="16" fill="url(#brand)"/>
    <path d="M44 64 L44 100 L74 82 Z" fill="#FFFFFF"/>
    <circle cx="24" cy="148" r="6" fill="#6366F1"/>
    <circle cx="48" cy="148" r="6" fill="#3F8FD6"/>
    <circle cx="72" cy="148" r="6" fill="#22A6C0"/>
    <circle cx="96" cy="148" r="6" fill="#14B8A6"/>
  </g>

  <text x="250" y="122" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="88" font-weight="700" letter-spacing="-2" fill="url(#brandText)">runops</text>
  <text x="254" y="164" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" fill="#8B949E">Simulation runs, driven by your AI agent.</text>

  <g transform="translate(254 184)">
    <rect x="0" y="0" width="378" height="34" rx="17" fill="none" stroke="#8B949E" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="18" y="23" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#8B949E">$ runo init</text>
    <text x="140" y="23" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#14B8A6">→</text>
    <text x="166" y="23" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#8B949E">talk to your agent</text>
  </g>
</svg>
